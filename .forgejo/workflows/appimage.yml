name: Build Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for existing release
        id: meta
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          test -n "$VERSION"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $TOKEN" "$API/releases/tags/v$VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release token
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          curl -fsS -o /dev/null \
            -H "Authorization: token $TOKEN" \
            "${{ github.server_url }}/api/v1/user"

  appimage:
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: bash scripts/ci-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  windows:
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Windows cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis
          LLVM_RC="$(find /usr/lib/llvm-*/bin -type f -name llvm-rc | sort -V | tail -n1)"
          test -n "$LLVM_RC"
          echo "$(dirname "$LLVM_RC")" >> "$GITHUB_PATH"
          cargo install cargo-xwin --locked --version 0.23.1

      - name: Build Windows installer
        shell: bash
        run: bash scripts/ci-windows.sh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [meta, appimage, windows]
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Publish release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"v$VERSION\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"v$VERSION\",\"draft\":true}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' \) -print
          for f in $(find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' \)); do
            curl -fsS -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done
          curl -fsS -X PATCH "$API/releases/$ID" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d '{"draft":false}'
