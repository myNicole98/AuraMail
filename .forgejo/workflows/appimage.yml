name: Build Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'release-notes/**'
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for existing release
        id: meta
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          test -n "$VERSION"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $TOKEN" "$API/releases/tags/v$VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            test -s "release-notes/v$VERSION.md" || {
              echo "error: release-notes/v$VERSION.md is required for v$VERSION" >&2
              echo "Add the release notes before bumping the version." >&2
              exit 1
            }
          fi

      - name: Verify release token
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          curl -fsS -o /dev/null \
            -H "Authorization: token $TOKEN" \
            "${{ github.server_url }}/api/v1/user"

  appimage:
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: bash scripts/ci-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  windows:
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Windows cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis zip
          # Ubuntu's clang package does not ship the clang-cl driver name.
          printf '#!/bin/sh\nexec /usr/bin/clang --driver-mode=cl "$@"\n' \
            | sudo tee /usr/local/bin/clang-cl >/dev/null
          sudo chmod +x /usr/local/bin/clang-cl
          LLVM_RC="$(find /usr/lib/llvm-*/bin -type f -name llvm-rc | sort -V | tail -n1)"
          test -n "$LLVM_RC"
          echo "$(dirname "$LLVM_RC")" >> "$GITHUB_PATH"
          cargo install cargo-xwin --locked --version 0.23.1

      - name: Build Windows installer
        shell: bash
        run: bash scripts/ci-windows.sh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*-windows-update.zip
          if-no-files-found: error

  macos:
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Job containers are created by the runner's DIND daemon, so the
      # container's default gateway is that daemon. Point the CLI at it; no
      # runner configuration or host-gateway entry is needed.
      - name: Connect to the Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          # /proc/net/route always exists, unlike iproute2 in a slim image.
          gateway=""
          while read -r _iface destination gateway_hex _rest; do
            if [ "$destination" = "00000000" ]; then
              a=$((16#${gateway_hex:6:2}))
              b=$((16#${gateway_hex:4:2}))
              c=$((16#${gateway_hex:2:2}))
              d=$((16#${gateway_hex:0:2}))
              gateway="$a.$b.$c.$d"
              break
            fi
          done < /proc/net/route
          test -n "$gateway" || { echo "no default gateway; DIND is unreachable" >&2; exit 1; }
          export DOCKER_HOST="tcp://$gateway:2375"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          docker info >/dev/null

      # Jobs run inside the DIND daemon, which cannot see this container's
      # filesystem. Build an image with the toolchain, copy the checkout into
      # a container over the API, and copy the artifacts back out.
      - name: Build the macOS toolchain image
        shell: bash
        run: docker build -f packaging/macos/Dockerfile -t auramail-macos packaging/macos

      - name: Build macOS app
        shell: bash
        run: |
          set -euo pipefail
          docker create --name auramail-macos-build \
            auramail-macos bash -lc 'npm ci && bash scripts/ci-macos.sh'
          tar -cf - \
            --exclude=./node_modules \
            --exclude=./src-tauri/target \
            --exclude=./dist \
            --exclude=./release \
            --exclude=./.git \
            . | docker cp - auramail-macos-build:/src
          docker start -a auramail-macos-build
          mkdir -p release
          docker cp auramail-macos-build:/src/release/. release/
          docker rm auramail-macos-build

      - name: Upload macOS app
        uses: actions/upload-artifact@v3
        with:
          name: macos-app
          path: |
            release/*.dmg
            release/*-macos-update.zip
          if-no-files-found: error

  publish:
    needs: [meta, appimage, windows, macos]
    if: needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Compose release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/ci-release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          NOTES: ${{ runner.temp }}/release-notes.md
          COMMIT: ${{ github.sha }}
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          python3 - "$VERSION" "$COMMIT" "$NOTES" > "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          version, commit, notes = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(notes) as handle:
              body = handle.read()
          print(json.dumps({
              "tag_name": f"v{version}",
              "target_commitish": commit,
              "name": f"v{version}",
              "draft": True,
              "body": body,
          }))
          PY
          ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/release.json" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          (
            cd artifacts
            find . -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 |
              sort -z |
              while IFS= read -r -d '' file; do
                printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
              done
          ) > "$RUNNER_TEMP/SHA256SUMS"
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print
          for f in $(find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \)); do
            curl -fsS -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done
          curl -fsS -X POST "$API/releases/$ID/assets?name=SHA256SUMS" \
            -H "Authorization: token $TOKEN" -F "attachment=@$RUNNER_TEMP/SHA256SUMS"
          curl -fsS -X PATCH "$API/releases/$ID" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d '{"draft":false}'
