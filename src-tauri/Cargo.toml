[package]
name = "auramail"
version = "0.1.3"
edition = "2021"
license = "MIT"

[lib]
name = "auramail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
native-tls = "0.2"
imap = { version = "2", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
mail-parser = "0.10"
ammonia = "4"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
notify = "8"
base64 = "0.22"
libloading = "0.8"
sha2 = "0.10"
rand = "0.8"
hickory-resolver = "0.24"
fs2 = "0.4"
fast-dav-rs = "=0.19.0"
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
webkit2gtk = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }
